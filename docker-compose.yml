version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # If you have build-time environment variables, you can set them here or use an env_file
      - NODE_ENV=production
    # If you want to use the .env file in this directory
    # env_file:
    #   - .env
